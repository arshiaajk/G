
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSX — Official Music</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #fff;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    padding: 35px 7%;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 100px;
}

.date {
    font-size: 11px;
    letter-spacing: 2px;
    color: #777;
}

.logo {
    font-size: 35px;
    font-weight: 900;
    letter-spacing: 7px;
    animation: logoMove 4s ease-in-out infinite alternate;
}

@keyframes logoMove {
    from {
        letter-spacing: 7px;
        opacity: .65;
    }
    to {
        letter-spacing: 12px;
        opacity: 1;
    }
}

section {
    max-width: 850px;
    margin: auto;
}

.section-title {
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: bold;
    margin-bottom: 35px;
}

.track {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 20px 0;
    border-bottom: 1px solid #e8e8e8;
}

.cover {
    width: 125px;
    height: 125px;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
}

.track-info {
    flex: 1;
    min-width: 0;
}

.track-info h3 {
    font-size: 17px;
    margin-bottom: 7px;
}

.track-info p {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

audio {
    width: 100%;
    max-width: 380px;
    height: 35px;
}

.view-more {
    display: block;
    width: fit-content;
    margin: 45px auto 110px;
    padding: 14px 35px;
    border: 1px solid #111;
    color: #111;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    transition: .3s;
}

.view-more:hover {
    background: #111;
    color: #fff;
}

.archive-text {
    font-size: 12px;
    color: #888;
    line-height: 2;
    margin: -15px 0 35px;
}

.album-heading {
    margin-top: 55px;
    padding: 20px 0;
    border-top: 1px solid #ddd;
}

.album-heading h3 {
    font-size: 17px;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.album-heading p {
    font-size: 10px;
    color: #888;
    letter-spacing: 2px;
}

.about {
    border-top: 1px solid #e8e8e8;
    padding-top: 40px;
    margin-bottom: 80px;
}

.about p {
    font-size: 13px;
    line-height: 2;
    color: #777;
    max-width: 550px;
}

footer {
    text-align: center;
    border-top: 1px solid #eee;
    padding-top: 30px;
    font-size: 10px;
    color: #999;
    letter-spacing: 2px;
}

footer a {
    color: #111;
    text-decoration: none;
}

@media (max-width: 600px) {
    body {
        padding: 25px 6%;
    }

    header {
        margin-bottom: 70px;
    }

    .logo {
        font-size: 27px;
    }

    .track {
        gap: 15px;
    }

    .cover {
        width: 95px;
        height: 95px;
    }

    .track-info h3 {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="date" id="date"></div>
    <div class="logo">ARSX</div>
</header>

<main>

<section id="music">
    <h2 class="section-title">MUSIC</h2>
    <div id="mainTracks"></div>

    <a href="#more-music" class="view-more">VIEW MORE</a>
</section>

<section id="more-music">
    <h2 class="section-title">MORE MUSIC</h2>

    <p class="archive-text">
        ARSX MUSIC ARCHIVE<br>
        More music is coming soon. Stay tuned for new releases.
    </p>

    <div id="extraTracks"></div>
</section>

<section class="about">
    <h2 class="section-title">ABOUT</h2>
    <p>
        ARSX is an independent music platform.
        Discover music, explore sounds and stay connected
        for upcoming releases.
    </p>
</section>

</main>

<footer>
    <a href="https://t.me/Ars_teamX" target="_blank">
        TELEGRAM
    </a>
    <p style="margin-top:15px;">
        © 2026 ARSX — ALL RIGHTS RESERVED
    </p>
</footer>

<script>

document.getElementById("date").textContent =
    new Date().toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });

const tracks = [

    // ORIGINAL MUSIC
    {
        title: "Fargh Darim",
        artist: "Shahin Miri",
        cover: "IMG_5068.jpeg",
        audio: "Shahin Miri – Fargh Darim.mp3"
    },

    // HIPHOPOLOGIST
    {
        title: "Bache Mardom",
        artist: "Hiphopologist",
        cover: "bache-mardom.jpg",
        audio: "bache-mardom.mp3"
    },
    {
        title: "Rotation",
        artist: "Hiphopologist",
        cover: "rotation.jpg",
        audio: "rotation.mp3"
    },

    // SYSTEM OF A DOWN
    {
        title: "Chop Suey!",
        artist: "System Of A Down",
        cover: "chop-suey.jpg",
        audio: "chop-suey.mp3"
    },
    {
        title: "Toxicity",
        artist: "System Of A Down",
        cover: "toxicity.jpg",
        audio: "toxicity.mp3"
    },
    {
        title: "Lonely Day",
        artist: "System Of A Down",
        cover: "lonely-day.jpg",
        audio: "lonely-day.mp3"
    },

    // SAJAD SHAHI — TAJ ALBUM
    {
        title: "SHAH",
        artist: "Sajad Shahi feat. Dorcci",
        cover: "taj.jpg",
        audio: "taj-01-shah.mp3",
        album: "TAJ"
    },
    {
        title: "Koosh",
        artist: "Sajad Shahi feat. Ali Geramy",
        cover: "taj.jpg",
        audio: "taj-02-koosh.mp3",
        album: "TAJ"
    },
    {
        title: "Ghesse",
        artist: "Sajad Shahi",
        cover: "taj.jpg",
        audio: "taj-03-ghesse.mp3",
        album: "TAJ"
    },
    {
        title: "Taghas",
        artist: "Sajad Shahi",
        cover: "taj.jpg",
        audio: "taj-04-taghas.mp3",
        album: "TAJ"
    },
    {
        title: "BALLISTIC",
        artist: "Sajad Shahi",
        cover: "taj.jpg",
        audio: "taj-05-ballistic.mp3",
        album: "TAJ"
    },
    {
        title: "Dige",
        artist: "Sajad Shahi feat. Moreshahin",
        cover: "taj.jpg",
        audio: "taj-06-dige.mp3",
        album: "TAJ"
    },
    {
        title: "SLEEP MODE",
        artist: "Sajad Shahi, Matin Fattahi, Dorcci, Ali Geramy & 6ehtash",
        cover: "taj.jpg",
        audio: "taj-07-sleep-mode.mp3",
        album: "TAJ"
    },
    {
        title: "Samtam",
        artist: "Sajad Shahi",
        cover: "taj.jpg",
        audio: "taj-08-samtam.mp3",
        album: "TAJ"
    },
    {
        title: "DEEV",
        artist: "Sajad Shahi feat. 6ehtash",
        cover: "taj.jpg",
        audio: "taj-09-deev.mp3",
        album: "TAJ"
    },
    {
        title: "TAJ (Outro)",
        artist: "Sajad Shahi & Ali Janak",
        cover: "taj.jpg",
        audio: "taj-10-taj-outro.mp3",
        album: "TAJ"
    }

];

function createTrack(track) {

    const card = document.createElement("div");
    card.className = "track";

    const cover = document.createElement("img");
    cover.className = "cover";
    cover.src = "./assets/" + encodeURIComponent(track.cover);
    cover.alt = track.title;

    const info = document.createElement("div");
    info.className = "track-info";

    const title = document.createElement("h3");
    title.textContent = track.title;

    const artist = document.createElement("p");
    artist.textContent = track.artist;

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = "./assets/" + encodeURIComponent(track.audio);

    info.appendChild(title);
    info.appendChild(artist);
    info.appendChild(audio);

    card.appendChild(cover);
    card.appendChild(info);

    return card;
}

// FIRST THREE SONGS
const mainTracks = document.getElementById("mainTracks");

tracks.slice(0, 3).forEach(track => {
    mainTracks.appendChild(createTrack(track));
});

// MORE MUSIC
const extraTracks = document.getElementById("extraTracks");

let currentAlbum = "";

tracks.slice(3).forEach(track => {

    if (track.album && track.album !== currentAlbum) {
        currentAlbum = track.album;

        const heading = document.createElement("div");
        heading.className = "album-heading";

        const albumTitle = document.createElement("h3");
        albumTitle.textContent = currentAlbum;

        const albumArtist = document.createElement("p");
        albumArtist.textContent = "SAJAD SHAHI — FULL ALBUM";

        heading.appendChild(albumTitle);
        heading.appendChild(albumArtist);

        extraTracks.appendChild(heading);
    }

    extraTracks.appendChild(createTrack(track));
});

</script>

</body>
</html>
